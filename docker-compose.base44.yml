services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: node:22
    working_dir: /app
    volumes:
      - "./kaira-autonomous-agent-foundation (1):/app"
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app_db
      - BASE44_PUBLIC_HOST_SUFFIX
    command: sh -c "npm install && npx drizzle-kit push && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  node_modules:
  next_cache:
